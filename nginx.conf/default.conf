server {
    listen       80;
    listen  [::]:80;
    server_name  192.168.8.10;

    #access_log  /var/log/nginx/host.access.log  main;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }
# Proxy all /rack/ requests to Flask (except static files)
location /rack/ {
    proxy_pass http://192.168.8.10:4444/;  # Trailing slash removes /rack/
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Script-Name /rack;  # Tell Flask it's under /rack/
}

# Handle static files for Flask app
location /rack/static/ {
    # Add some debug logging
    access_log /var/log/nginx/rack_static.log;
    
    proxy_pass http://192.168.8.10:4444/static/;  # Proxy to Flask's /static/
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Add proxy timeout settings
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    
    # Cache static files (optional)
    expires 30d;
}

    # Handle all Jupyter paths
    location ~* /(tree|login|logout|api|files|static|custom|user|metrics|terminals|nbconvert|nbextensions|voila|edit|notebooks|shutdown) {
        proxy_pass http://192.168.8.10:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Redirect /tree to /tree/ to avoid issues with relative paths
    location = /tree {
        return 302 /tree/;
    }
    # Block direct access to / (optional)
    location = / {
        return 404;
    }
    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
