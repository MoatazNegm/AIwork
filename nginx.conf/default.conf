server {
    server_name  192.168.8.10;

    #access_log  /var/log/nginx/host.access.log  main;
    location /llm/ {
	    proxy_pass http://192.168.8.10:3001/;
	    proxy_http_version 1.1;
	    
	    # WebSocket and standard headers
	    proxy_set_header Upgrade $http_upgrade;
	    proxy_set_header Connection "upgrade";
	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
	    
	    # Critical: Tell Flowise it's hosted under /llm/
	    proxy_set_header X-Forwarded-Prefix /llm;
	    
	    # Rewrite rules - BOTH of these are needed:
	    rewrite ^/llm$ /llm/ permanent;  # Force trailing slash
	    rewrite ^/llm/(.*)$ /$1 break;   # Remove prefix for backend
	    proxy_read_timeout 300s;
	    
    }

    # Handle assets specifically for LLM app - this should come BEFORE the generic assets location
    location /assets/ {
        proxy_pass http://192.168.8.10:3001;
        proxy_http_version 1.1;
        
        # Standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache settings for assets
        expires 1y;
        add_header Cache-Control "public, immutable";
        proxy_read_timeout 300s;
    }
    
    # Handle API calls for LLM app
    location /api/ {
        proxy_pass http://192.168.8.10:3001;
        proxy_http_version 1.1;
        
        # WebSocket and standard headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 300s;
    }
    location /h2o/ {
        proxy_pass http://192.168.8.10:54321/;  # Trailing slash is important
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support if H2O-3 uses it
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Rewrite redirects to include the /h2o prefix
        proxy_redirect / /h2o/;
    }
    location / {
	proxy_pass http://192.168.8.10:4444;
    }
location /fileman/ {
    # Remove the /fileman prefix when forwarding to the container
    rewrite ^/fileman/(.*)$ /$1 break;
    
    # Proxy to the Filebrowser container
    proxy_pass http://192.168.8.10:8080;
    
    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;
    
    # Important: Set the base URL for Filebrowser
    proxy_set_header X-Forwarded-Prefix /fileman;
    
    # WebSocket support (if needed for real-time features)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # Timeout settings for large file uploads
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    send_timeout 300;
    
    # Increase buffer sizes for better performance
    proxy_buffering off;
    proxy_request_buffering off;
    
    # Important: Remove trailing slash redirect
    proxy_redirect off;
}

# Optional: Handle the exact /fileman path (without trailing slash)
location = /fileman {
    return 301 /fileman/;
}

# If you need to increase upload size limits
client_max_body_size 1000M;
}


