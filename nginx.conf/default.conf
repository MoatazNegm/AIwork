server {
    server_name  192.168.8.10;

    #access_log  /var/log/nginx/host.access.log  main;

    location / {
	proxy_pass http://192.168.8.10:4444;
    }
location /fileman/ {
    # Remove the /fileman prefix when forwarding to the container
    rewrite ^/fileman/(.*)$ /$1 break;
    
    # Proxy to the Filebrowser container
    proxy_pass http://192.168.8.10:8080;
    
    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;
    
    # Important: Set the base URL for Filebrowser
    proxy_set_header X-Forwarded-Prefix /fileman;
    
    # WebSocket support (if needed for real-time features)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # Timeout settings for large file uploads
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    send_timeout 300;
    
    # Increase buffer sizes for better performance
    proxy_buffering off;
    proxy_request_buffering off;
    
    # Important: Remove trailing slash redirect
    proxy_redirect off;
}

# Optional: Handle the exact /fileman path (without trailing slash)
location = /fileman {
    return 301 /fileman/;
}

# If you need to increase upload size limits
client_max_body_size 1000M;
}


